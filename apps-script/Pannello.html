<!DOCTYPE html>
<html lang="it">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--ink:#1b1b1b;--muted:#585858;--line:#d8d2c6;--blue:#1f3fa8;--red:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#f6f4ef;line-height:1.5}
  header,main{max-width:760px;margin:0 auto;padding:0 16px}
  header{padding-top:24px}
  h1{font-family:Georgia,serif;font-weight:400;letter-spacing:.12em;text-transform:uppercase;font-size:1.4rem;margin:0 0 4px}
  header p{margin:0 0 20px;color:var(--muted)}
  main{padding-bottom:120px}
  .card{background:#fff;border:1px solid var(--line);padding:16px;margin-bottom:16px;display:grid;grid-template-columns:140px 1fr;gap:16px}
  .foto img,.foto .vuota{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;text-align:center}
  label{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
  input[type=text],textarea{width:100%;font:inherit;padding:10px;border:1px solid #8a8a8a;border-radius:0;margin-bottom:12px;background:#fff}
  textarea{min-height:90px;resize:vertical}
  button{font:inherit;min-height:44px;padding:0 16px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
  button.pri{background:var(--ink);color:#fff}
  button.del{border-color:var(--red);color:var(--red)}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .azioni{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .foto .azioni{flex-direction:column}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
  #msg{font-size:.95rem}
  #msg.err{color:var(--red)}
  @media (max-width:560px){.card{grid-template-columns:1fr}.foto{max-width:200px}}
</style>
</head>
<body>
<header>
  <h1>Calò Art · Opere</h1>
  <p>Cambia foto e testi, poi premi <strong>Salva modifiche</strong>. Il sito si aggiorna entro pochi minuti.</p>
</header>
<main id="lista"><p>Caricamento…</p></main>
<div class="bar">
  <button id="agg" type="button" disabled>+ Aggiungi opera</button>
  <button id="salva" type="button" class="pri" disabled>Salva modifiche</button>
  <span id="msg" role="status"></span>
</div>

<script>
  const FOTO_BASE = 'https://raw.githubusercontent.com/Andrea91x/CaloArt/main/';
  const V = Date.now();            // evita di vedere foto vecchie in anteprima
  let opere = [], sha = null, daEliminare = [];

  const $ = id => document.getElementById(id);
  const call = (fn, ...args) => new Promise((ok, ko) =>
    google.script.run.withSuccessHandler(ok).withFailureHandler(e => ko(new Error(e.message || e)))[fn](...args));
  function dica(testo, errore) { const m = $('msg'); m.textContent = testo; m.className = errore ? 'err' : ''; }

  async function ridimensiona(file) {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const s = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.82);
  }

  function disegna() {
    const box = $('lista'); box.innerHTML = '';
    if (!opere.length) box.innerHTML = '<p>Nessuna opera. Premi “Aggiungi opera”.</p>';
    opere.forEach((o, i) => {
      const card = document.createElement('section'); card.className = 'card';

      const foto = document.createElement('div'); foto.className = 'foto';
      const src = o.nuova || (o.foto ? FOTO_BASE + o.foto + '?v=' + V : '');
      if (src) { const im = document.createElement('img'); im.src = src; im.alt = 'Anteprima opera ' + (i + 1); foto.appendChild(im); }
      else { const v = document.createElement('div'); v.className = 'vuota'; v.textContent = 'Nessuna foto'; foto.appendChild(v); }
      const az = document.createElement('div'); az.className = 'azioni';
      const file = document.createElement('input'); file.type = 'file'; file.accept = 'image/*'; file.hidden = true;
      file.onchange = async () => {
        if (!file.files[0]) return;
        try { dica('Preparo la foto…'); o.nuova = await ridimensiona(file.files[0]); dica(''); disegna(); }
        catch (e) { dica('Non riesco a leggere questa foto. Prova con un JPEG.', true); }
      };
      const bf = document.createElement('button'); bf.type = 'button'; bf.textContent = src ? 'Cambia foto' : 'Scegli foto';
      bf.onclick = () => file.click();
      az.append(bf, file); foto.appendChild(az);

      const dati = document.createElement('div');
      dati.innerHTML =
        '<label for="t' + i + '">Titolo</label><input id="t' + i + '" type="text">' +
        '<label for="n' + i + '">Tecnica e misure</label><input id="n' + i + '" type="text" placeholder="es. Acrilico su tela · 70×100 cm · 2026">' +
        '<label for="d' + i + '">Descrizione</label><textarea id="d' + i + '"></textarea>';
      const campi = [['t', 'titolo'], ['n', 'info'], ['d', 'descrizione']];
      campi.forEach(([p, k]) => {
        const el = dati.querySelector('#' + p + i); el.value = o[k] || '';
        el.oninput = () => { o[k] = el.value; };
      });
      const az2 = document.createElement('div'); az2.className = 'azioni';
      const su = mk('↑ Su', () => muovi(i, -1)); su.disabled = i === 0;
      const giu = mk('↓ Giù', () => muovi(i, 1)); giu.disabled = i === opere.length - 1;
      const el = mk('Elimina', () => elimina(i)); el.classList.add('del');
      az2.append(su, giu, el); dati.appendChild(az2);

      card.append(foto, dati); box.appendChild(card);
    });
  }
  function mk(t, f) { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.onclick = f; return b; }
  function muovi(i, d) { const j = i + d; [opere[i], opere[j]] = [opere[j], opere[i]]; disegna(); }
  function elimina(i) {
    if (!confirm('Eliminare questa opera dal sito?')) return;
    if (opere[i].foto) daEliminare.push(opere[i].foto);
    opere.splice(i, 1); disegna();
  }

  $('agg').onclick = () => {
    opere.push({ id: 'o' + Date.now(), titolo: '', info: '', descrizione: '', foto: '', nuova: null });
    disegna(); window.scrollTo(0, document.body.scrollHeight);
  };

  $('salva').onclick = async () => {
    if (opere.some(o => !o.foto && !o.nuova)) { dica('Ogni opera ha bisogno di una foto.', true); return; }
    $('salva').disabled = $('agg').disabled = true;
    try {
      for (const o of opere) {
        if (o.nuova) {
          dica('Carico la foto di “' + (o.titolo || 'opera') + '”…');
          const p = await call('caricaFoto', o.nuova.split(',')[1]);
          if (o.foto) daEliminare.push(o.foto);
          o.foto = p; o.nuova = null;
        }
      }
      dica('Salvo…');
      const r = await call('salvaOpere', opere.map(({ id, titolo, info, descrizione, foto }) => ({ id, titolo, info, descrizione, foto })), sha, daEliminare);
      sha = r.sha; daEliminare = [];
      disegna(); dica('Salvato. Il sito si aggiorna entro pochi minuti.');
    } catch (e) { dica(e.message, true); }
    $('salva').disabled = $('agg').disabled = false;
  };

  call('leggiOpere').then(r => {
    opere = r.opere.map(o => Object.assign({ nuova: null }, o)); sha = r.sha;
    disegna(); $('salva').disabled = $('agg').disabled = false;
  }).catch(e => { $('lista').innerHTML = ''; dica(e.message, true); });
</script>
</body>
</html>
